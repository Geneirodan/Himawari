# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "dev" ]

jobs:    
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
         
      - name: Remove old GitHub packages
        run: |
          dotnet nuget remove source Github 
      
      - name: Add new Github packages
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/Geneirodan/index.json" \
            --name Github \
            --username Geneirodan \
            --password ${{ secrets.PACKAGES_TOKEN }} \
            --store-password-in-clear-text

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release
        
      - name: Run unit tests
        run: dotnet test --no-build --verbosity normal -c Release --filter "Category!=Integration"

      - name: Check Docker
        id: docker
        continue-on-error: true
        run: |
          if docker info > /dev/null 2>&1; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Run integration tests (Docker required)
        if: steps.docker.outputs.available == 'true'
        run: dotnet test --no-build --verbosity normal -c Release --filter "Category=Integration"
